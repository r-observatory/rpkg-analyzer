[package]
name = "rpkg-analyzer"
version = "0.2.0"
license = "LicenseRef-proprietary"
edition = "2024"

[dependencies]
blake3 = "1"
bzip2 = "0.5"
fancy-regex = "0.18.0"
flate2 = "1"
regex = "1"
xz2 = "0.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.26"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-fortran = "0.6.0"
tree-sitter-r = "1.3"
tree-sitter-rust = "0.24.2"
